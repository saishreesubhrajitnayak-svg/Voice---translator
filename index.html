<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Translator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .box {
      max-width: 500px;
      margin: 30px auto;
      padding: 25px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    select, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }

    select {
      border: 1px solid #ccc;
      background: white;
    }

    button {
      border: none;
      background: #222;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
    }

    #status {
      margin-top: 15px;
      font-size: 15px;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: #eee;
      border-radius: 10px;
      min-height: 50px;
      text-align: left;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>🎙️ Voice Translator</h1>

    <p>Speak and hear your voice.</p>

    <select id="language">
      <option value="en-IN">English</option>
      <option value="hi-IN">Hindi</option>
      <option value="or-IN">Odia</option>
    </select>

    <button id="speakButton">
      🎤 Speak
    </button>

    <div id="status">
      Ready
    </div>

    <div id="result">
      Your speech will appear here...
    </div>

    <button id="playButton">
      🔊 Play Voice
    </button>

  </div>

  <script>

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    const speakButton =
      document.getElementById("speakButton");

    const playButton =
      document.getElementById("playButton");

    const language =
      document.getElementById("language");

    const status =
      document.getElementById("status");

    const result =
      document.getElementById("result");

    let lastText = "";

    if (!SpeechRecognition) {

      status.innerText =
        "❌ Speech recognition is not supported in this browser.";

      speakButton.disabled = true;

    } else {

      const recognition = new SpeechRecognition();

      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      speakButton.onclick = function () {

        recognition.lang = language.value;

        status.innerText =
          "🎤 Starting microphone...";

        result.innerText =
          "Listening...";

        try {

          recognition.start();

        } catch (error) {

          status.innerText =
            "⚠️ Please wait 2 seconds and try again.";

        }
      };

      recognition.onstart = function () {

        status.innerText =
          "🎤 Listening... Speak now.";

        speakButton.innerText =
          "🎤 Listening...";

      };

      recognition.onresult = function (event) {

        lastText =
          event.results[0][0].transcript;

        result.innerText =
          lastText;

        status.innerText =
          "✅ Speech detected.";

        speakButton.innerText =
          "🎤 Speak";

      };

      recognition.onerror = function (event) {

        speakButton.innerText =
          "🎤 Speak";

        status.innerText =
          "❌ Error: " + event.error;

      };

      recognition.onend = function () {

        speakButton.innerText =
          "🎤 Speak";

      };
    }

    playButton.onclick = function () {

      if (!lastText) {

        status.innerText =
          "Nothing to play yet.";

        return;
      }

      const voice =
        new SpeechSynthesisUtterance(lastText);

      voice.lang =
        language.value;

      speechSynthesis.cancel();

      speechSynthesis.speak(voice);

    };

  </script>

</body>
</html>
