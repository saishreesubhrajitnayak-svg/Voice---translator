<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAYQO</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f4f4;padding:20px}
.box{max-width:500px;margin:auto;background:white;padding:25px;border-radius:20px}
h1{text-align:center}
select,textarea,button{width:100%;padding:14px;margin-top:12px;box-sizing:border-box;border-radius:10px;font-size:16px}
textarea{height:120px}
button{border:none;background:#222;color:white}
#output{margin-top:20px;padding:15px;background:#eee;border-radius:10px;min-height:50px}
#status{text-align:center;margin-top:15px}
</style>
</head>

<body>
<div class="box">
<h1>⚡ NAYQO</h1>
<p style="text-align:center">Speak. Translate. Connect.</p>

<select id="from">
<option value="or">ଓଡ଼ିଆ</option>
<option value="en">English</option>
<option value="hi">हिन्दୀ</option>
</select>

<select id="to">
<option value="en">English</option>
<option value="or">ଓଡ଼ିଆ</option>
<option value="hi">हिन्दୀ</option>
</select>

<textarea id="input" placeholder="ଏଠାରେ ଲେଖନ୍ତୁ..."></textarea>

<button onclick="translateText()">🌐 Translate</button>

<div id="status">Ready</div>
<div id="output">Translation will appear here...</div>
</div>

<script>
async function translateText(){
  const text=document.getElementById("input").value.trim();
  const from=document.getElementById("from").value;
  const to=document.getElementById("to").value;
  const output=document.getElementById("output");
  const status=document.getElementById("status");

  if(!text){
    status.innerText="⚠️ କିଛି text ଲେଖନ୍ତୁ।";
    return;
  }

  status.innerText="🔄 Translating...";
  output.innerText="";

  try{
    const url="https://api.mymemory.translated.net/get?q="+
      encodeURIComponent(text)+"&langpair="+from+"|"+to;

    const response=await fetch(url);
    const data=await response.json();

    if(data.responseData && data.responseData.translatedText){
      output.innerText=data.responseData.translatedText;
      status.innerText="✅ Translation complete";
    }else{
      output.innerText="Translation failed.";
      status.innerText="❌ Error";
    }
  }catch(error){
    output.innerText="Network error.";
    status.innerText="❌ Error";
  }
}
</script>
</body>
</html>
